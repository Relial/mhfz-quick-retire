[package]
name = "quick-retire"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
abi_stable = "0.11.3"
anyhow = "1.0.102"
ilhook = { version = "2.3.0", default-features = false, features = ["x86"] }
bunny-ui = {path = "../bunny-ui"}
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
mimalloc = "0.1.50"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
